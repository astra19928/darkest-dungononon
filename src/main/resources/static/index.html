<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <script defer src="populateLists.js" type="module"></script>
</head>
<body>
    <main>
        <img class="site-background" src="assets/Site-background-dark.png">
        <div class="site-logo"><img src="assets/Site-logo.webp"></div>

        <div class="site-content">

            <div class="heroi-container">
                <label for="heroi-list-check">
                    <p class="clickable-list-title">Heróis</p>
                </label>
                <input type="checkbox" id="heroi-list-check" class="list-check" name="heroi-list-check" checked>
                <div id="heroi-list-container" class="list-container">
                    <header></header>

                    <ul class="list" id="list-heroi"></ul>

                </div>
            </div>

            <div class="quirk-container">
                <label for="quirk-list-check">
                    <p class="clickable-list-title">Quirks</p>
                </label>
                <input type="checkbox" id="quirk-list-check" class="list-check" name="quirk-list-check" checked>
                <div id="quirk-list-container" class="list-container">
                    <header></header>

                    <ul class="list" id="list-quirk"></ul>

                </div>
            </div>

            <div class="info-container">
                <label for="info-list-check">
                    Informação
                </label>
                <input type="checkbox" id="info-list-check" class="list-check" checked>
                <div>
                    <header></header>

                    <div class="info-list" id="list-info">
                        <p class="tip">Clique em um item para ver suas informações!</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
