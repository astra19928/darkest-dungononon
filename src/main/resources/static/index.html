<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <img class="site-background" src="assets/Site-background-dark.png">
        <div class="site-logo"><img src="assets/Site-logo.webp"></div>

        <div class="site-content">

            <div class="heroi-container">
                <label for="heroi-list-check">
                    <p class="clickable-list-title">Heróis</p>
                </label>
                <input type="checkbox" id="heroi-list-check" class="list-check" name="heroi-list-check">
                <div id="heroi-list" class="list-container">
                    <header></header>

                    <ul class="list">
                        <li>Dismas</li>
                        <li>Pithou</li>
                        <li>Reynauld</li>
                        <li>Paracelsus</li>
                    </ul>
                </div>
            </div>

            <div class="quirk-container">
                <label for="quirk-list-check">
                    <p class="clickable-list-title">Quirks</p>
                </label>
                <input type="checkbox" id="quirk-list-check" class="list-check" name="quirk-list-check">
                <div id="quirk-list" class="list-container">
                    <header></header>

                    <ul class="list">
                        <li>Cleptomaníaco</li>
                        <li>Medo da morte</li>
                        <li>Obsessivo</li>
                        <li>Claustrofóbico</li>
                    </ul>
                </div>
            </div>

            <div class="info-container">
                <label for="info-list-check">
                    Informação
                </label>
                <input type="checkbox" id="info-list-check" class="list-check" checked>
                <div>
                    <header></header>

                    <div class="info-list">
                        <p>Cleptomaníaco</p>
                        <p>Medo da morte</p>
                        <p>Obsessivo</p>
                        <p>Claustrofóbico</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
